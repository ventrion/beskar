name: Rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.89.0", stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install '${{ matrix.toolchain }}' --profile minimal
      - name: Test offline
        run: cargo +${{ matrix.toolchain }} test --workspace --offline
      - name: Build release offline
        run: cargo +${{ matrix.toolchain }} build --workspace --release --offline
      - name: Install lint tools
        if: matrix.toolchain == 'stable'
        run: rustup component add --toolchain stable rustfmt clippy
      - name: Check formatting
        if: matrix.toolchain == 'stable'
        run: cargo +stable fmt --all --check
      - name: Lint
        if: matrix.toolchain == 'stable'
        run: cargo +stable clippy --workspace --all-targets --offline -- -D warnings
      - name: Check documentation
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --no-deps --offline
