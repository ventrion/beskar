name: Create release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version (X.Y.Z), or major / minor / patch'
        required: true
        default: patch
        type: string

permissions:
  contents: read

concurrency:
  group: create-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: '15.0'

jobs:
  prepare:
    name: Prepare version and release notes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Bump version and write changelog
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py prepare --version "$VERSION" --repository "$GITHUB_REPOSITORY"
      - name: Commit prepared release
        id: commit
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock CHANGELOG.md "docs/releases/$TAG.md"
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): $TAG"
          fi
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN pushes do not start another push workflow. Call CI explicitly.
  checks:
    name: Release checks
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build and package CLI, TUI and GUI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python scripts/release.py validate --tag "$TAG"
          cargo build --release --locked --target "$TARGET" -p beskar-cli -p beskar-gui
          extension=''
          if [[ "$TARGET" == *windows* ]]; then extension='.exe'; fi
          "target/$TARGET/release/beskar$extension" --version
          python scripts/release.py package --tag "$TAG" --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beskar-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Tag and publish complete release
    needs: [prepare, checks, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: beskar-*
          merge-multiple: true
          path: dist
      - name: Create immutable version tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python scripts/release.py validate --tag "$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag -a "$TAG" -m "Beskar $TAG"
          fi
          git push origin "refs/tags/$TAG"
      - name: Publish archives and release notes
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish --tag "$TAG" --repository "$GITHUB_REPOSITORY"
