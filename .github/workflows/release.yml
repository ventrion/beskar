name: Release

# A pushed tag vX.Y.Z publishes a GitHub release. Pull requests that touch
# this file and manual runs build and test the same archives without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read version and check tag
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --offline |
            jq -r '.packages[] | select(.name == "beskar-cli") | .version')
          if [[ $GITHUB_REF == refs/tags/* && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, test: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, test: true }
          - { target: x86_64-apple-darwin, os: macos-latest, test: false }
          - { target: aarch64-apple-darwin, os: macos-latest, test: true }
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            test: true
            rustflags: -C target-feature=+crt-static
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            test: false
            rustflags: -C target-feature=+crt-static
    env:
      TARGET: ${{ matrix.target }}
      NAME: beskar-v${{ needs.plan.outputs.version }}-${{ matrix.target }}
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - name: Test
        if: matrix.test
        run: cargo +stable test --workspace --locked --offline --no-fail-fast --target "$TARGET"
      - name: Build
        run: cargo +stable build --release --locked --offline --target "$TARGET" -p beskar-cli
      - name: Package
        env:
          COPYFILE_DISABLE: 1
        run: |
          exe=beskar
          [[ $TARGET == *windows* ]] && exe=beskar.exe
          mkdir -p "dist/$NAME"
          cp "target/$TARGET/release/$exe" README.md "dist/$NAME/"
          cd dist
          if [[ $TARGET == *windows* ]]; then
            7z a -tzip "$NAME.zip" "$NAME"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
          rm -r "$NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.NAME }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "Beskar $VERSION" --generate-notes
