[package]
name = "beskar-gui"
description = "Beskar desktop GUI (bin: beskar-gui) — eframe/egui over beskar-core (spec §102-§104)"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Optional non-default backends (spec §125 CI): `wayland` enables eframe's
# Wayland backend for native Wayland sessions. It is OFF by default so the
# shipped build (x11/glow) stays buildable headless and in CI without
# libwayland. Enable with: cargo build -p beskar-gui --features wayland
# (needs libwayland-dev/libxkbcommon-dev on Linux).
[features]
wayland = ["eframe/wayland"]

[[bin]]
name = "beskar-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
beskar-core = { workspace = true }
beskar-git = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
beskar-test-support = { workspace = true }
